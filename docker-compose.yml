services:
  nginx:
    container_name: nginx-my-azevedo
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www
    networks:
      - blog-network
  app:
    container_name: php-my-azevedo
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    env_file:
      - .env
    volumes:
      - ./src:/var/www
    networks:
      - blog-network
  db:
    container_name: db-my-azevedo
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - blog-network
  redis:
    container_name: redis-my-azevedo
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - blog-network

networks:
  blog-network: 
    driver: bridge

volumes:
  postgres_data:
    driver: local
